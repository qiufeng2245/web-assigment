<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MamaMiya Music — Minimal Shop</title>
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text-main: #111111;
      --text-muted: #777777;
      --border-color: #eaeaea;
      --accent: #222222;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    /* Minimal Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 4rem;
      background: var(--bg);
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .cart-link {
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s;
    }

    .cart-link:hover {
      color: var(--text-main);
    }

    /* Minimal Layout */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 3rem 4rem;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 4rem;
    }

    /* Minimal Sidebar Controls */
    aside h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .filter-group {
      margin-bottom: 2rem;
    }

    .filter-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    select, input[type="range"] {
      width: 100%;
      padding: 0.6rem 0;
      border: none;
      border-bottom: 1px solid var(--border-color);
      background: transparent;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    /* Top Action Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 2.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .top-bar h1 {
      font-size: 1.8rem;
      font-weight: 400;
      letter-spacing: -0.03em;
    }

    .sort-wrapper {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Grid Layout */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 3rem 2rem;
    }

    /* Product Card */
    .product-card {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      background-color: #f0f0f0;
      overflow: hidden;
      margin-bottom: 1.2rem;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .product-card:hover .image-wrapper img {
      transform: scale(1.04);
    }

    /* Minimalist Logo Badge */
    .brand-tag {
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.9);
      padding: 0.25rem 0.6rem;
      color: #000;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.95rem;
    }

    .card-title {
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .card-price {
      font-weight: 500;
    }

    .card-details {
      display: flex;
      justify-content: space-between;
      margin-top: 0.4rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Clean Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: var(--surface);
      width: 90%;
      max-width: 800px;
      padding: 3rem;
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
    }

    .modal-close {
      position: absolute;
      top: 1.5rem;
      right: 2rem;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .btn-action {
      margin-top: 1.5rem;
      width: 100%;
      padding: 1rem;
      background: var(--text-main);
      color: #fff;
      border: none;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-action:hover {
      opacity: 0.85;
    }

    .reviews-list {
      margin-top: 1.5rem;
      border-top: 1px solid var(--border-color);
      padding-top: 1rem;
      max-height: 150px;
      overflow-y: auto;
    }

    .review-item {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
    }

    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; padding: 2rem; }
      .modal-content { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Minimal Header -->
  <header>
    <div class="brand">MamaMiya</div>
    <div class="cart-link" id="cartCount">Cart (0)</div>
  </header>

  <!-- Container -->
  <div class="container">
    
    <!-- Sidebar -->
    <aside>
      <h3>Refine</h3>

      <div class="filter-group">
        <label>Category</label>
        <select id="categoryFilter" onchange="applyFilters()">
          <option value="all">All Instruments</option>
          <option value="Guitar">Guitar</option>
          <option value="Piano">Piano</option>
          <option value="Ukulele">Ukulele</option>
          <option value="Violin">Violin</option>
          <option value="Drums kits">Drums kits</option>
          <option value="Trumpets">Trumpets</option>
          <option value="Flute">Flute</option>
          <option value="Harmonica">Harmonica</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Availability</label>
        <select id="stockFilter" onchange="applyFilters()">
          <option value="all">All Items</option>
          <option value="in">In Stock</option>
          <option value="out">Out of Stock</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Max Price — $<span id="priceLabel">1500</span></label>
        <input type="range" id="priceFilter" min="50" max="1500" step="50" value="1500" oninput="updatePrice(this.value)" onchange="applyFilters()">
      </div>
    </aside>

    <!-- Main Section -->
    <main>
      <div class="top-bar">
        <h1>Catalog</h1>
        <div class="sort-wrapper">
          <span>Sort</span>
          <select id="sortFilter" onchange="applyFilters()" style="width: auto;">
            <option value="default">Featured</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="rating">Rating</option>
          </select>
        </div>
      </div>

      <div class="products-grid" id="gridContainer"></div>
    </main>
  </div>

  <!-- Minimal Modal -->
  <div class="modal" id="productModal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeModal()">&times;</span>
      
      <div class="image-wrapper">
        <img id="mImg" src="" alt="Product">
        <div class="brand-tag">MamaMiya</div>
      </div>

      <div style="display: flex; flex-direction: column; justify-content: center;">
        <h2 id="mTitle" style="font-weight: 400; font-size: 1.5rem; margin-bottom: 0.5rem;"></h2>
        <div id="mPrice" style="font-size: 1.2rem; margin-bottom: 1rem;"></div>
        <p id="mDesc" style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.6;"></p>
        
        <button class="btn-action" onclick="addToCart()">Add to Bag</button>

        <div class="reviews-list">
          <div style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem;">Reviews</div>
          <div id="mReviews"></div>
        </div>
      </div>
    </div>
  </div>

    let itemsInCart = 0;

    function renderProducts(items) {
      const grid = document.getElementById('gridContainer');
      grid.innerHTML = "";

      if (items.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; color: var(--text-muted); font-size: 0.9rem;">No instruments found.</p>`;
        return;
      }

      items.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.onclick = () => openModal(p.id);
        card.innerHTML = `
          <div class="image-wrapper">
            <img src="${p.img}" alt="${p.name}">
            <div class="brand-tag">MamaMiya</div>
          </div>
          <div class="card-meta">
            <span class="card-title">${p.name}</span>
            <span class="card-price">$${p.price}</span>
          </div>
          <div class="card-details">
            <span>★ ${p.rating}</span>
            <span>${p.stock === 'in' ? 'Available' : 'Out of Stock'}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function applyFilters() {
      const category = document.getElementById('categoryFilter').value;
      const stock = document.getElementById('stockFilter').value;
      const maxPrice = parseFloat(document.getElementById('priceFilter').value);
      const sort = document.getElementById('sortFilter').value;

      let filtered = products.filter(p => {
        const matchCat = category === 'all' || p.category === category;
        const matchStock = stock === 'all' || p.stock === stock;
        const matchPrice = p.price <= maxPrice;
        return matchCat && matchStock && matchPrice;
      });

      if (sort === 'price-low') filtered.sort((a, b) => a.price - b.price);
      if (sort === 'price-high') filtered.sort((a, b) => b.price - a.price);
      if (sort === 'rating') filtered.sort((a, b) => b.rating - a.rating);

      renderProducts(filtered);
    }

    function updatePrice(v) {
      document.getElementById('priceLabel').innerText = v;
    }

    function openModal(id) {
      const p = products.find(x => x.id === id);
      document.getElementById('mImg').src = p.img;
      document.getElementById('mTitle').innerText = p.name;
      document.getElementById('mPrice').innerText = `$${p.price}`;
      document.getElementById('mDesc').innerText = p.desc;
      
      const revs = document.getElementById('mReviews');
      revs.innerHTML = p.reviews.map(r => `<div class="review-item">— "${r}"</div>`).join('');
      
      document.getElementById('productModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('productModal').style.display = 'none';
    }

    function addToCart() {
      itemsInCart++;
      document.getElementById('cartCount').innerText = `Cart (${itemsInCart})`;
      closeModal();
    }

    renderProducts(products);
  </script>
</body>
</html>
