<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MamaMiya Music — Minimal Shop</title>
  <link rel="stylesheet" href="css/product.css">
</head>
<body>

  <!-- Minimal Header -->
  <!-- Minimal Header with Back Button -->
  <header>
    <div style="display: flex; align-items: center; gap: 1.5rem;">
      <a href="HomePage.html" class="back-link">&larr; Back to Home</a>
      <div class="brand">MamaMiya</div>
    </div>
    <div class="cart-link" id="cartCount">Cart (0)</div>
  </header>

  <!-- Container -->
  <div class="container">
    
    <!-- Sidebar -->
    <aside>
      <h3>Refine</h3>

      <!-- ADDED: SEARCH BAR FILTER GROUP -->
      <div class="filter-group">
        <label for="searchInput">Search Instruments</label>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="e.g. Guitar, Piano..." 
          oninput="applyFilters()" 
          class="search-input"
        />
      </div>

      <div class="filter-group">
        <label>Category</label>
        <select id="categoryFilter" onchange="applyFilters()">
          <option value="all">All Instruments</option>
          <option value="Guitar">Guitar</option>
          <option value="Piano">Piano</option>
          <option value="Ukulele">Ukulele</option>
          <option value="Violin">Violin</option>
          <option value="Drums kits">Drums kits</option>
          <option value="Trumpets">Trumpets</option>
          <option value="Flute">Flute</option>
          <option value="Harmonica">Harmonica</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Availability</label>
        <select id="stockFilter" onchange="applyFilters()">
          <option value="all">All Items</option>
          <option value="in">In Stock</option>
          <option value="out">Out of Stock</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Max Price — $<span id="priceLabel">1500</span></label>
        <input type="range" id="priceFilter" min="50" max="1500" step="50" value="1500" oninput="updatePrice(this.value)" onchange="applyFilters()">
      </div>
    </aside>

    <!-- Main Section -->
    <main>
      <div class="top-bar">
        <h1>Catalog</h1>
        <div class="sort-wrapper">
          <span>Sort</span>
          <select id="sortFilter" onchange="applyFilters()" style="width: auto;">
            <option value="default">Featured</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="rating">Rating</option>
          </select>
        </div>
      </div>

      <div class="products-grid" id="gridContainer"></div>
    </main>
  </div>

  <!-- Minimal Modal -->
  <div class="modal" id="productModal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeModal()">&times;</span>
      
      <div class="image-wrapper">
        <img id="mImg" src="" alt="Product">
        <div class="brand-tag">MamaMiya</div>
      </div>

      <div style="display: flex; flex-direction: column; justify-content: center;">
        <h2 id="mTitle" style="font-weight: 400; font-size: 1.5rem; margin-bottom: 0.5rem;"></h2>
        <div id="mPrice" style="font-size: 1.2rem; margin-bottom: 1rem;"></div>
        <p id="mDesc" style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.6;"></p>
        
        <button class="btn-action" onclick="addToCart()">Add to Bag</button>

        <div class="reviews-list">
          <div style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem;">Reviews</div>
          <div id="mReviews"></div>
        </div>
      </div>
    </div>
  </div>

<footer class="footer">

    <div class="footer-brand">
            <span class="brand-letter brand-left">M</span>
            <span class="brand-letter brand-center">M</span>
            <span class="brand-letter brand-right">M</span>
    </div>

    <div class="footer-contact">
            <p>Music Store</p>

            <a href="mailto:admin@mamamiya.com">admin@mamamiya.com &rarr;</a>
    </div>

    <nav class="footer-nav">
        <a href="HomePage.html" class="footer-step-1">&bull;Home</a>
        <a href="product.html" class="footer-step-2">&bull;Shop Instruments</a>
        <a href="AboutUs.html" class="footer-step-3">&bull;About Us</a>
    </nav>

        <div class="footer-social">
            <a href="https://instagram.com/mamamiya_music" target="_blank">Instagram.</a>
            <a href="https://threads.net/@mamamiya_music" target="_blank">Threads.</a>
            <a href="https://facebook.com/MamaMiya_Music" target="_blank">Facebook.</a>
        </div>
    
        <div class="footer-bottom">
            <p>&copy; 2026 MamaMiya Music. All rights reserved.</p>
        </div>

        <p class="footer-credit">
            Designed for music lovers.
        </p>
</footer>

  <button
    type="button"
    id="theme-btn"
    aria-label="Switch to dark mode"
    >
    🌙
  </button>

  <script src="js/product.js"></script>
</body>
</html>
